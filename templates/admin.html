<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Back — Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root{--bg:#0f0f13;--surface:#1a1a24;--surface2:#22222f;--border:#2e2e40;--accent:#6c63ff;
    --green:#00e676;--yellow:#ffd740;--red:#ff5252;--text:#e8e8f0;--muted:#7a7a9a;
    --pc:#4fc3f7;--laptop:#ce93d8;--gold:#ffd700;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:1.25rem;letter-spacing:2px;text-transform:uppercase;}
  header h1 span{color:var(--accent);}
  .nav{display:flex;gap:10px;align-items:center;}
  .nav-link{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;text-decoration:none;font-size:0.82rem;}
  .nav-link:hover{border-color:var(--accent);}
  .nav-link.proj{background:#6c63ff20;color:var(--accent);border-color:#6c63ff60;}

  .tabs{display:flex;gap:6px;background:var(--surface);padding:0 16px;border-bottom:1px solid var(--border);}
  .tab{padding:14px 22px;font-size:0.85rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;
    border:none;background:transparent;color:var(--muted);border-bottom:3px solid transparent;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab .badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;font-size:0.7rem;margin-left:6px;}

  .content{padding:24px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;}
  .card h3{font-size:0.85rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:14px;}
  .reg{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--surface2);border:1px solid var(--border);
    border-radius:10px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap;}
  .reg .who{flex:1;min-width:220px;}
  .reg .who .nm{font-weight:600;}
  .reg .who .det{font-size:0.78rem;color:var(--muted);margin-top:2px;}
  .reg .team-note{font-size:0.8rem;color:var(--laptop);margin-top:4px;}
  .reg-actions{display:flex;gap:8px;}
  .btn{padding:9px 16px;border:none;border-radius:6px;font-weight:700;font-size:0.8rem;cursor:pointer;transition:opacity .2s;}
  .btn:active{transform:scale(.96);}
  .btn-green{background:var(--green);color:#000;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-accent{background:var(--accent);color:#fff;}

  .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:0.68rem;font-weight:700;text-transform:uppercase;}
  .tag-pc{background:#4fc3f720;color:var(--pc);border:1px solid #4fc3f740;}
  .tag-laptop{background:#ce93d820;color:var(--laptop);border:1px solid #ce93d840;}
  .tag-team{background:#ff658420;color:#ff6584;border:1px solid #ff658440;}
  .tag-running{background:#00e67620;color:var(--green);border:1px solid #00e67640;}

  .waiting-note{color:var(--muted);font-size:0.82rem;}
  .empty{color:var(--muted);text-align:center;padding:18px;font-size:0.85rem;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;padding:8px 12px;font-size:0.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);}
  td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:0.85rem;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:monospace;}
  .pen-cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
  .pen-cfg .field{display:flex;flex-direction:column;gap:5px;}
  .pen-cfg label{font-size:0.75rem;color:var(--muted);}
  .pen-cfg input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:0.85rem;}
  input:focus{outline:none;border-color:var(--accent);}

  .staff-row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--border);font-size:0.85rem;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 20px;font-size:0.85rem;transform:translateY(120px);opacity:0;transition:all .3s;z-index:200;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.success{border-color:var(--green);color:var(--green);}
  .toast.error{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>
<header>
  <h1>BUILD <span>BACK</span> — Admin</h1>
  <div class="nav">
    <a href="/competitors" target="_blank" class="nav-link">➕ Competitor</a>
    <a href="/projector" target="_blank" class="nav-link proj">📊 Projector</a>
    <a href="/volunteer" target="_blank" class="nav-link">🔧 Station</a>
    <button class="nav-link" style="border:none;cursor:pointer" onclick="logout()">Logout</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tab-regs" onclick="setTab('regs')">Registrations<span class="badge" id="reg-badge" style="display:none"></span></button>
  <button class="tab" id="tab-parts" onclick="setTab('parts')">All Participants</button>
  <button class="tab" id="tab-staff" onclick="setTab('staff')">Staff<span class="badge" id="staff-badge" style="display:none"></span></button>
  <button class="tab" id="tab-stations" onclick="setTab('stations')">Stations</button>
  <button class="tab" id="tab-cfg" onclick="setTab('cfg')">Penalty Config</button>
</div>

<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<script>
const socket=io();
let pending=[];
let stations=[];
const IS_ADMIN = {{ 'true' if is_admin else 'false' }};

socket.on('leaderboard_update',loadAll);
socket.on('stations_update',loadAll);
socket.on('projector_update',loadAll);

async function loadAll(){ await Promise.all([loadRegs(),loadParts(),loadStaff(),loadStations()]); }
function setTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if(t==='regs')renderRegs(); else if(t==='parts')renderParts(); else if(t==='staff')renderStaff(); else if(t==='stations')renderStations(); else renderCfg();
}
async function loadStations(){
  const r=await fetch('/api/stations'); stations=await r.json();
  if(document.getElementById('tab-stations').classList.contains('active'))renderStations();
}
function renderStations(){
  const el=document.getElementById('content');
  const pc=stations.filter(s=>s.level==='PC'), lp=stations.filter(s=>s.level==='Laptop');
  const row=(s)=>({pc:(...a)=>`<div class="station-row">
      <div><span class="tag tag-pc">PC</span> Station ${s.number} <span style="color:var(--muted);font-size:.8rem">${s.volunteer_label?'· '+s.volunteer_label:''}</span></div>
      <button class="btn btn-red" onclick="delStation(${s.id})">Delete</button></div>`,
    Laptop:(...a)=>`<div class="station-row">
      <div><span class="tag" style="color:var(--laptop);border-color:var(--laptop)">Laptop</span> Station ${s.number} <span style="color:var(--muted);font-size:.8rem">${s.volunteer_label?'· '+s.volunteer_label:''}</span></div>
      <button class="btn btn-red" onclick="delStation(${s.id})">Delete</button></div>`})[s.level];

  el.innerHTML=`<div class="card"><h3>PC Stations (${pc.length})</h3>${pc.map(row).join('')||'<div class="empty">None</div>'}</div>
    <div class="card"><h3>Laptop Stations (${lp.length})</h3>${lp.map(row).join('')||'<div class="empty">None</div>'}</div>
    ${IS_ADMIN?`<div class="card"><h3>Add Station</h3>
      <select id="st-level" style="width:200px;margin-right:10px">
        <option value="PC">PC Station</option><option value="Laptop">Laptop Station</option>
      </select>
      <button class="btn btn-accent" style="width:200px" onclick="addStation()">Add Station</button></div>`:''}`;
}
async function addStation(){
  const r=await fetch('/api/stations',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({level:document.getElementById('st-level').value})});
  const d=await r.json();
  showToast(d.ok?'Station added':(d.error||'Error'), d.ok?'success':'error');
  if(d.ok) renderStations();
}
async function delStation(id){
  if(!confirm('Delete this station?'))return;
  await fetch('/api/stations/'+id,{method:'DELETE'}); renderStations();
}
async function loadRegs(){
  const r=await fetch('/api/registrations'); pending=r.json(); 
  if(document.getElementById('tab-regs').classList.contains('active'))renderRegs();
  const b=document.getElementById('reg-badge'); const n=pending.filter(x=>!x.approved).length;
  b.style.display=n?'inline-block':'none'; b.textContent=n;
}
function renderRegs(){
  const el=document.getElementById('content');
  const un=pending.filter(x=>!x.approved), ap=pending.filter(x=>x.approved);
  if(!pending.length){el.innerHTML='<div class="card"><h3>Registrations</h3><div class="empty">No registrations yet</div></div>';return;}
  const px=(r)=>`
    <div class="reg">
      <div class="who">
        <div class="nm">${esc(r.students[0]?.name||'?')} <span class="tag ${r.play_mode==='team'?'tag-team':'tag-pc'}">${r.play_mode}</span></div>
        <div class="det">${esc(r.students[0]?.department||'')} · Sem ${esc(r.students[0]?.semester||'')} · ${esc(r.students[0]?.college||'')}</div>
        ${r.play_mode==='team'&&r.students[1]?`<div class="team-note">👥 Mate: ${esc(r.students[1].name)} — ${esc(r.students[1].department)} · Sem ${esc(r.students[1].semester)} · ${esc(r.students[1].college)}</div>`:''}
      </div>
      <div class="reg-actions">
        ${r.approved?'<span class="tag tag-pc" style="border-color:var(--green);color:var(--green)">Approved</span>':
          `<button class="btn btn-green" onclick="approveReg(${r.id})">✓ Approve</button>
           <button class="btn btn-red" onclick="rejectReg(${r.id})">✕ Reject</button>`}
      </div>
    </div>`;
  el.innerHTML=`<div class="card"><h3>Pending Approval (${un.length})</h3>${un.length?un.map(px).join(''):'<div class="empty">Nothing pending</div>'}</div>
    ${ap.length?`<div class="card"><h3>Approved (${ap.length})</h3>${ap.map(px).join('')}</div>`:''}`;
}
async function approveReg(id){ await fetch('/api/registrations/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({participant_id:id})}); showToast('Approved','success'); }
async function rejectReg(id){ await fetch('/api/registrations/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({participant_id:id})}); showToast('Rejected'); }

let parts=[];
async function loadParts(){ const r=await fetch('/api/participants/list'); parts=await r.json(); if(document.getElementById('tab-parts').classList.contains('active'))renderParts(); }
function renderParts(){
  const el=document.getElementById('content');
  if(!parts.length){el.innerHTML='<div class="card"><h3>All Participants</h3><div class="empty">No approved participants</div></div>';return;}
  const rows=parts.map(p=>{ const mr=[]; for(const c of ['PC','Laptop']){ const r=p.runs.find(x=>x.category===c);
    let st='<span class="tag tag-pc">waiting</span>';
    if(r.status==='running')st='<span class="tag tag-running">running</span>';
    else if(r.status==='finished'&&!r.disqualified)st=`<span class="mono" style="color:var(--green)">${fmt(r.final_seconds)}</span>`;
    else if(r.disqualified)st='<span class="tag tag-red" style="color:var(--red);border-color:var(--red)">DQ</span>';
    mr.push(`${c}: ${st}`); }
    // combined
    const pc=p.runs.find(x=>x.category==='PC'), lp=p.runs.find(x=>x.category==='Laptop');
    const done=(pc&&lp&&pc.status==='finished'&&lp.status==='finished'&&!pc.disqualified&&!lp.disqualified);
    const comb=done?fmt(pc.final_seconds+lp.final_seconds):'—';
    return `<tr><td>${esc(p.name)}${p.mate?`<div style="font-size:.72rem;color:var(--muted)">👥 ${esc(p.mate)}</div>`:''}</td>
      <td>${mr.join(' · ')}</td><td class="mono">${comb}</td></tr>`;
  }).join('');
  el.innerHTML=`<div class="card"><h3>All Participants — ${parts.length}</h3>
    <table><thead><tr><th>Name</th><th>Runs</th><th>Combined</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

let staff={pending:[],all:[]};
async function loadStaff(){
  const [p,a]=await Promise.all([(await fetch('/api/staff/pending')).json(),(await fetch('/api/staff/list')).json()]);
  staff={pending:p,all:a};
  if(document.getElementById('tab-staff').classList.contains('active'))renderStaff();
  const b=document.getElementById('staff-badge'); b.style.display=p.length?'inline-block':'none'; b.textContent=p.length;
}
function renderStaff(){
  const el=document.getElementById('content');
  const staffRow=(u)=>`<div class="staff-row">
    <div><b>${esc(u.display_name||u.username)}</b> <span class="tag tag-pc" style="${u.role==='admin'?'color:var(--accent);border-color:var(--accent);':''}">${u.role}</span>
      <span style="color:var(--muted);font-size:0.75rem"> @ ${esc(u.station||'—')}</span></div>
    <div style="display:flex;gap:8px">
      ${u.approved?'':'<button class="btn btn-green" onclick="approveStaff('+u.id+')">Approve</button>'}
      <button class="btn btn-red" onclick="delStaff('+u.id+')">Delete</button>
    </div></div>`;
  el.innerHTML=`<div class="card"><h3>Pending Staff (${staff.pending.length})</h3>${staff.pending.length?staff.pending.map(staffRow).join(''):'<div class="empty">None</div>'}</div>
    <div class="card"><h3>Active Staff (${staff.all.length})</h3>${staff.all.map(staffRow).join('')}</div>
    ${IS_ADMIN?`<div class="card"><h3>Create Admin / Super</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="field"><label>Role</label>
          <select id="cs-role"><option value="super">Super</option><option value="admin">Admin</option></select></div>
        <div class="field"><label>Display Name</label><input id="cs-name" placeholder="Name"></div>
        <div class="field"><label>Username</label><input id="cs-user" placeholder="username"></div>
        <div class="field"><label>Password</label><input id="cs-pass" placeholder="password"></div>
      </div>
      <button class="btn btn-accent" style="margin-top:14px" onclick="createStaff()">Create Staff Account</button></div>`:''}`;
}
async function createStaff(){
  if(!confirm('Create this staff account?'))return;
  const r=await fetch('/api/auth/create-staff',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('cs-user').value.trim(),
      password:document.getElementById('cs-pass').value,role:document.getElementById('cs-role').value,
      display_name:document.getElementById('cs-name').value.trim()})});
  const d=await r.json();
  showToast(d.ok?d.msg:(d.error||'Error'), d.ok?'success':'error');
  if(d.ok){['cs-name','cs-user','cs-pass'].forEach(id=>document.getElementById(id).value='');}
}
async function approveStaff(uid){ await fetch('/api/staff/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})}); showToast('Staff approved','success'); }
async function delStaff(uid){ if(!confirm('Delete staff account?'))return; await fetch('/api/staff/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})}); showToast('Deleted'); }

let cfg=[];
async function renderCfg(){
  const r=await fetch('/api/settings/penalties'); cfg=await r.json();
  const el=document.getElementById('content');
  el.innerHTML=`<div class="card"><h3>Build Penalty Values (seconds added)</h3>
    <div class="pen-cfg" id="pen-grid"></div>
    <button class="btn btn-accent" style="margin-top:20px" onclick="saveCfg()">Save Penalties</button></div>`;
  renderPenGrid();
}
function renderPenGrid(){
  const grid=document.getElementById('pen-grid');
  grid.innerHTML=cfg.map((p,i)=>`<div class="field" data-i="${i}">
    <label>${p.label}</label>
    <input type="number" min="0" step="1" value="${p.secs}" data-i="${i}" class="pen-sec">
  </div>`).join('');
}
async function saveCfg(){
  const updated=cfg.map((p,i)=>({key:p.key,label:p.label,secs:parseInt(document.querySelector(`.pen-sec[data-i="${i}"]`).value)||0}));
  const r=await fetch('/api/settings/penalties',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({penalties:updated})});
  const d=await r.json(); showToast('Penalties saved','success');
}

async function logout(){ await fetch('/api/auth/logout',{method:'POST'}); window.location.href='/login'; }
function fmt(s){ s=Math.max(0,s||0); const m=Math.floor(s/60); return `${m}:${(s%60).toFixed(1).padStart(4,'0')}`; }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const toast=document.getElementById('toast');
function showToast(m,t='success'){ toast.textContent=m; toast.className=`toast show ${t}`; setTimeout(()=>toast.className='toast',2400); }

loadAll();
</script>
</body>
</html>
