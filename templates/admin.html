<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Back — Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root{--bg:#06070b;--ink:#f2f4f7;--muted:#96a0ad;--border:rgba(255,255,255,.12);--accent:#fff;--accent2:#7c8694;
    --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(1100px at 20% 0%,rgba(255,255,255,.07),transparent 55%),var(--bg);
    color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:-25%;z-index:-2;
    background:radial-gradient(720px at 18% 20%,rgba(255,255,255,.09),transparent 60%),
      radial-gradient(640px at 86% 12%,rgba(180,190,210,.07),transparent 60%),
      radial-gradient(700px at 75% 85%,rgba(255,255,255,.06),transparent 60%);
    animation:aurora 18s ease-in-out infinite alternate;pointer-events:none;}
  @keyframes aurora{0%{transform:translate(0,0) rotate(0deg);}100%{transform:translate(3%,-2%) rotate(3deg);}}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  header{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);padding:12px 22px;position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header h1{font-size:1.1rem;letter-spacing:2px;text-transform:uppercase;font-weight:800;
    background:linear-gradient(90deg,#fff,#8a93a1);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .nav-link{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--ink);padding:7px 12px;
    border-radius:10px;text-decoration:none;font-size:.78rem;transition:all .25s;cursor:pointer;font-family:inherit;}
  .nav-link:hover{border-color:rgba(255,255,255,.45);color:#fff;transform:translateY(-1px);}
  .nav-link.proj{border-color:rgba(255,255,255,.4);}

  .tabs{display:flex;gap:4px;background:rgba(5,6,10,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:0 14px;border-bottom:1px solid var(--border);position:sticky;top:58px;z-index:40;}
  .tab{padding:14px 24px;font-size:.86rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;
    border:none;background:transparent;color:var(--muted);border-bottom:3px solid transparent;transition:all .25s;font-family:'Inter',sans-serif;}
  .tab:hover{color:#fff;}
  .tab.active{color:#fff;border-bottom-color:var(--accent);text-shadow:0 0 12px rgba(255,255,255,.4);}
  .tab .badge{background:linear-gradient(135deg,#fff,#b9c0cb);color:#0a0c12;border-radius:10px;padding:1px 7px;font-size:.7rem;margin-left:6px;box-shadow:0 2px 8px rgba(255,255,255,.3);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}

  .content{padding:24px;max-width:1500px;margin:0 auto;animation:rise .5s both;}
  .card{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border);
    border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08);}
  .card h3{font-size:.74rem;text-transform:uppercase;letter-spacing:2px;color:#fff;margin-bottom:14px;font-weight:700;}
  .reg{display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(255,255,255,.05);border:1px solid var(--border);
    border-radius:13px;padding:14px 16px;margin-bottom:10px;flex-wrap:wrap;transition:all .25s;animation:rise .4s both;}
  .reg:hover{border-color:rgba(255,255,255,.35);transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,255,255,.08);}
  .reg .who{flex:1;min-width:240px;}
  .reg .who .nm{font-weight:600;}
  .reg .who .det{font-size:.78rem;color:var(--muted);margin-top:2px;}
  .reg .team-note{font-size:.8rem;color:#fff;margin-top:4px;}
  .reg-actions{display:flex;gap:8px;}
  .btn{padding:9px 16px;border:none;border-radius:9px;font-weight:700;font-size:.8rem;cursor:pointer;transition:all .25s;font-family:inherit;}
  .role-sel{background:rgba(8,9,12,.6);border:1px solid var(--border);color:var(--ink);padding:7px 10px;border-radius:9px;
    font-size:.8rem;outline:none;cursor:pointer;font-family:inherit;}
  .role-sel:hover{border-color:rgba(255,255,255,.5);}
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:scale(.96);}
  .btn-green{background:linear-gradient(135deg,#fff,#c3c9d2);color:#0a0c12;box-shadow:0 6px 18px rgba(255,255,255,.2);}
  .btn-red{background:linear-gradient(135deg,#565a63,#26282e);color:#f2f4f7;box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .btn-ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12);}
  .btn-accent{background:linear-gradient(135deg,#fff,#b9c0cb);color:#0a0c12;box-shadow:0 6px 18px rgba(255,255,255,.2);}

  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .tag-pc{border:1px solid rgba(255,255,255,.45);color:#fff;}
  .tag-laptop{border:1px solid rgba(255,255,255,.45);color:#fff;}
  .tag-team{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.14);color:#fff;}
  .tag-running{border:1px solid var(--accent);color:#fff;background:rgba(255,255,255,.16);animation:pulse 1.4s infinite;}
  .tag-red{border:1px solid rgba(255,255,255,.5);color:#fff;}

  .waiting-note{color:var(--muted);font-size:.82rem;}
  .empty{color:var(--muted);text-align:center;padding:18px;font-size:.85rem;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;padding:8px 12px;font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);}
  td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:.85rem;}
  tbody tr{transition:background .2s;}
  tbody tr:hover{background:rgba(255,255,255,.05);}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:ui-monospace,monospace;}
  .pen-cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
  .pen-cfg .field{display:flex;flex-direction:column;gap:5px;}
  .pen-cfg label{font-size:.75rem;color:var(--muted);}
  .pen-cfg input{background:rgba(8,9,12,.6);border:1px solid var(--border);color:var(--ink);padding:9px 11px;border-radius:9px;font-size:.85rem;transition:all .2s;outline:none;}
  .pen-cfg input:focus{border-color:rgba(255,255,255,.5);box-shadow:0 0 0 3px rgba(255,255,255,.1);}

  .staff-row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--border);font-size:.85rem;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:rgba(255,255,255,.1);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:12px;padding:13px 22px;
    font-size:.85rem;opacity:0;transition:all .35s;z-index:200;box-shadow:0 14px 40px rgba(0,0,0,.5);}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .toast.success{border-color:rgba(255,255,255,.55);color:#fff;}
  .toast.error{border-color:rgba(255,255,255,.55);color:#fff;}

  @media (max-width:860px){
    header{padding:10px 14px;}
    .tabs{padding:0 8px;top:54px;overflow-x:auto;}
    .tab{padding:13px 14px;font-size:.78rem;white-space:nowrap;}
    .content{padding:16px 14px;}
  }
</style>
</head>
<body>
<header>
  <h1>BUILD BACK — Admin</h1>
  <div class="nav">
    <a href="/competitors" class="nav-link">➕ Competitor</a>
    <a href="/projector" class="nav-link proj">📊 Projector</a>
    <a href="/volunteer" class="nav-link">🔧 Station</a>
    <button class="nav-link" style="border:none;cursor:pointer" onclick="logout()">Logout</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tab-regs" onclick="setTab('regs')">Registrations<span class="badge" id="reg-badge" style="display:none"></span></button>
  <button class="tab" id="tab-parts" onclick="setTab('parts')">All Participants</button>
  <button class="tab" id="tab-staff" onclick="setTab('staff')">Staff<span class="badge" id="staff-badge" style="display:none"></span></button>
  <button class="tab" id="tab-cfg" onclick="setTab('cfg')">Penalty Config</button>
</div>

<div class="content" id="content"></div>
<div class="toast" id="toast"></div>

<script>
const socket=io();
let pending=[];
const IS_ADMIN = {{ 'true' if is_admin else 'false' }};

socket.on('leaderboard_update',loadAll);
socket.on('stations_update',loadAll);
socket.on('projector_update',loadAll);

async function loadAll(){ await Promise.all([loadRegs(),loadParts(),loadStaff()]); }
function setTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  localStorage.setItem('adminTab',t);
  if(t==='regs')renderRegs(); else if(t==='parts')renderParts(); else if(t==='staff')renderStaff(); else renderCfg();
}
async function loadRegs(){
  const r=await fetch('/api/registrations'); pending=r.json();
  if(document.getElementById('tab-regs').classList.contains('active'))renderRegs();
  const b=document.getElementById('reg-badge'); const n=pending.filter(x=>!x.approved).length;
  b.style.display=n?'inline-block':'none'; b.textContent=n;
}
function renderRegs(){
  const el=document.getElementById('content');
  const un=pending.filter(x=>!x.approved), ap=pending.filter(x=>x.approved);
  if(!pending.length){el.innerHTML='<div class="card"><h3>Registrations</h3><div class="empty">No registrations yet</div></div>';return;}
  const px=(r)=>`
    <div class="reg">
      <div class="who">
        <div class="nm">${esc(r.students[0]?.name||'?')} <span class="tag ${r.play_mode==='team'?'tag-team':'tag-pc'}">${r.play_mode}</span></div>
        <div class="det">${esc(r.students[0]?.department||'')} · Sem ${esc(r.students[0]?.semester||'')} · ${esc(r.students[0]?.college||'')}</div>
        ${r.play_mode==='team'&&r.students[1]?`<div class="team-note">👥 Mate: ${esc(r.students[1].name)} — ${esc(r.students[1].department)} · Sem ${esc(r.students[1].semester)} · ${esc(r.students[1].college)}</div>`:''}
      </div>
      <div class="reg-actions">
        ${r.approved?'<span class="tag tag-pc" style="border-color:#fff;color:#fff">Approved</span>':
          `<button class="btn btn-green" onclick="approveReg(${r.id})">✓ Approve</button>
           <button class="btn btn-red" onclick="rejectReg(${r.id})">✕ Reject</button>`}
      </div>
    </div>`;
  el.innerHTML=`<div class="card"><h3>Pending Approval (${un.length})</h3>${un.length?un.map(px).join(''):'<div class="empty">Nothing pending</div>'}</div>
    ${ap.length?`<div class="card"><h3>Approved (${ap.length})</h3>${ap.map(px).join('')}</div>`:''}`;
}
async function approveReg(id){ await fetch('/api/registrations/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({participant_id:id})}); showToast('Approved','success'); loadRegs(); }
async function rejectReg(id){ await fetch('/api/registrations/reject',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({participant_id:id})}); showToast('Rejected'); loadRegs(); }

let parts=[];
async function loadParts(){ const r=await fetch('/api/participants/list'); parts=await r.json(); if(document.getElementById('tab-parts').classList.contains('active'))renderParts(); }
function renderParts(){
  const el=document.getElementById('content');
  if(!parts.length){el.innerHTML='<div class="card"><h3>All Participants</h3><div class="empty">No approved participants</div></div>';return;}
  const rows=parts.map(p=>{ const mr=[]; for(const c of ['PC','Laptop']){ const r=p.runs.find(x=>x.category===c);
    let st='<span class="tag tag-pc">waiting</span>';
    if(r.status==='running')st='<span class="tag tag-running">running</span>';
    else if(r.status==='finished'&&!r.disqualified)st=`<span class="mono" style="color:#fff">${fmt(r.final_seconds)}</span>`;
    else if(r.disqualified)st='<span class="tag tag-red" style="color:#fff;border-color:#fff">DQ</span>';
    mr.push(`${c}: ${st}`); }
    // combined
    const pc=p.runs.find(x=>x.category==='PC'), lp=p.runs.find(x=>x.category==='Laptop');
    const done=(pc&&lp&&pc.status==='finished'&&lp.status==='finished'&&!pc.disqualified&&!lp.disqualified);
    const comb=done?fmt(pc.final_seconds+lp.final_seconds):'—';
    return `<tr><td>${esc(p.name)}${p.mate?`<div style="font-size:.72rem;color:var(--muted)">👥 ${esc(p.mate)}</div>`:''}</td>
      <td>${mr.join(' · ')}</td><td class="mono">${comb}</td></tr>`;
  }).join('');
  el.innerHTML=`<div class="card"><h3>All Participants — ${parts.length}</h3>
    <table><thead><tr><th>Name</th><th>Runs</th><th>Combined</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

let staff={pending:[],all:[]};
async function loadStaff(){
  const [p,a]=await Promise.all([(await fetch('/api/staff/pending')).json(),(await fetch('/api/staff/list')).json()]);
  staff={pending:p,all:a};
  if(document.getElementById('tab-staff').classList.contains('active'))renderStaff();
  const b=document.getElementById('staff-badge'); b.style.display=p.length?'inline-block':'none'; b.textContent=p.length;
}
function renderStaff(){
  const el=document.getElementById('content');
  const staffRow=(u)=>`<div class="staff-row">
    <div><b>${esc(u.display_name||u.username)}</b> <span class="tag tag-pc" style="${u.role==='admin'?'color:#fff;border-color:#fff;':''}">${u.role}</span>
      <span style="color:var(--muted);font-size:0.75rem"> @ ${esc(u.station||'—')}</span></div>
    <div style="display:flex;gap:8px;align-items:center">
      ${u.approved?'':'<button class="btn btn-green" onclick="approveStaff('+u.id+')">Approve</button>'}
      ${IS_ADMIN&&u.approved?`<select class="role-sel" onchange="setRole(${u.id},this.value)">
          ${['volunteer','super','admin'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${r}</option>`).join('')}
        </select>`:''}
      <button class="btn btn-red" onclick="delStaff('+u.id+')">Delete</button>
    </div></div>`;
  el.innerHTML=`<div class="card"><h3>Pending Staff (${staff.pending.length})</h3>${staff.pending.length?staff.pending.map(staffRow).join(''):'<div class="empty">None</div>'}</div>
    <div class="card"><h3>Active Staff (${staff.all.length})</h3>
      <div class="empty" style="padding:8px 0 14px;font-size:.78rem">Assign any role to an active account — role changes take effect on their next load.</div>
      ${staff.all.map(staffRow).join('')||'<div class="empty">None</div>'}</div>`;
}
async function setRole(uid,role){
  const r=await fetch('/api/staff/role',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid,role})});
  const d=await r.json();
  showToast(d.ok?('Role → '+role):(d.error||'Error'), d.ok?'success':'error');
  loadStaff();
}
async function approveStaff(uid){ const r=await fetch('/api/staff/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})}); const d=await r.json(); showToast(d.ok?'Staff approved':(d.error||'Error'), d.ok?'success':'error'); loadStaff(); }
async function delStaff(uid){ if(!confirm('Delete staff account?'))return; const r=await fetch('/api/staff/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({uid})}); const d=await r.json(); showToast(d.ok?'Deleted':(d.error||'Error'), d.ok?'success':'error'); loadStaff(); }

let cfg=[];
async function renderCfg(){
  const r=await fetch('/api/settings/penalties'); cfg=await r.json();
  const el=document.getElementById('content');
  el.innerHTML=`<div class="card"><h3>Build Penalty Values (seconds added)</h3>
    <div class="pen-cfg" id="pen-grid"></div>
    <button class="btn btn-accent" style="margin-top:20px" onclick="saveCfg()">Save Penalties</button></div>`;
  renderPenGrid();
}
function renderPenGrid(){
  const grid=document.getElementById('pen-grid');
  grid.innerHTML=cfg.map((p,i)=>`<div class="field" data-i="${i}">
    <label>${p.label}</label>
    <input type="number" min="0" step="1" value="${p.secs}" data-i="${i}" class="pen-sec">
  </div>`).join('');
}
async function saveCfg(){
  const updated=cfg.map((p,i)=>({key:p.key,label:p.label,secs:parseInt(document.querySelector(`.pen-sec[data-i="${i}"]`).value)||0}));
  const r=await fetch('/api/settings/penalties',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({penalties:updated})});
  const d=await r.json(); showToast('Penalties saved','success');
}

async function logout(){ await fetch('/api/auth/logout',{method:'POST'}); window.location.href='/login'; }
function fmt(s){ s=Math.max(0,s||0); const m=Math.floor(s/60); return `${m}:${(s%60).toFixed(1).padStart(4,'0')}`; }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const toast=document.getElementById('toast');
function showToast(m,t='success'){ toast.textContent=m; toast.className=`toast show ${t}`; setTimeout(()=>toast.className='toast',2400); }

const savedTab=localStorage.getItem('adminTab');
if(savedTab && document.getElementById('tab-'+savedTab)) setTab(savedTab);
loadAll();
</script>
</body>
</html>
