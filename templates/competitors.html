<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Back — Add Competitor</title>
<style>
  :root{--bg:#06070b;--ink:#f2f4f7;--muted:#96a0ad;--border:rgba(255,255,255,.12);--accent:#fff;--accent2:#7c8694;
    --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(1100px at 20% 0%,rgba(255,255,255,.07),transparent 55%),var(--bg);
    color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:-25%;z-index:-2;
    background:radial-gradient(720px at 18% 20%,rgba(255,255,255,.09),transparent 60%),
      radial-gradient(640px at 86% 12%,rgba(180,190,210,.07),transparent 60%),
      radial-gradient(700px at 75% 85%,rgba(255,255,255,.06),transparent 60%);
    animation:aurora 18s ease-in-out infinite alternate;pointer-events:none;}
  @keyframes aurora{0%{transform:translate(0,0) rotate(0deg);}100%{transform:translate(3%,-2%) rotate(3deg);}}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}

  header{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);padding:12px 18px;position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header h1{font-size:1.05rem;letter-spacing:2px;text-transform:uppercase;font-weight:800;
    background:linear-gradient(90deg,#fff,#8a93a1);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .who{font-size:.78rem;color:var(--muted);white-space:nowrap;}
  .nav-link{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--ink);padding:7px 12px;
    border-radius:10px;text-decoration:none;font-size:.78rem;transition:all .25s;cursor:pointer;font-family:inherit;}
  .nav-link:hover{border-color:rgba(255,255,255,.45);color:#fff;transform:translateY(-1px);}
  .nav-link.active{border-color:rgba(255,255,255,.6);color:#fff;background:rgba(255,255,255,.12);}
  .nav-link.proj{border-color:rgba(255,255,255,.4);}

  .wrap{max-width:700px;margin:28px auto;padding:0 18px;animation:rise .55s both;}
  .card{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--border);
    border-radius:22px;padding:26px;box-shadow:0 30px 90px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09);position:relative;}
  .tabs{display:flex;gap:6px;margin-bottom:20px;background:rgba(0,0,0,.3);padding:5px;border-radius:14px;}
  .tab{flex:1;padding:12px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:600;
    cursor:pointer;font-size:.84rem;letter-spacing:.5px;transition:all .25s;font-family:'Inter',sans-serif;}
  .tab:hover{color:var(--ink);}
  .tab.active{background:linear-gradient(135deg,#fff,#b9c0cb);color:#0a0c12;box-shadow:0 4px 18px rgba(255,255,255,.2);}
  .mode-notice{font-size:.82rem;color:var(--muted);margin-bottom:18px;}
  .section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:2px;color:#fff;margin:18px 0 12px;font-weight:700;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;}
  .field label{font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
  .field label .req{color:#fff;}
  .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  @media (max-width:480px){ .three{grid-template-columns:1fr 1fr;} }
  input,select{background:rgba(8,9,12,.6);border:1px solid var(--border);color:var(--ink);padding:11px 13px;border-radius:11px;
    font-size:.9rem;width:100%;outline:none;transition:all .2s;font-family:'Inter',sans-serif;}
  input::placeholder{color:#4d5563;}
  input:focus,select:focus{border-color:rgba(255,255,255,.5);box-shadow:0 0 0 3px rgba(255,255,255,.1);background:rgba(255,255,255,.09);}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .25s;
    position:relative;overflow:hidden;font-family:'Inter',sans-serif;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,#fff,#b9c0cb);color:#0a0c12;box-shadow:0 10px 30px rgba(255,255,255,.14);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(255,255,255,.22);}
  .msg{display:none;padding:12px 15px;border-radius:10px;font-size:.85rem;margin-top:14px;animation:rise .3s both;}
  .msg.err{display:block;background:rgba(255,255,255,.06);color:#f2f4f7;border:1px solid rgba(255,255,255,.35);}
  .msg.ok{display:block;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.4);}
</style>
</head>
<body>
<header>
  <h1>BUILD BACK — Competitor</h1>
  <div class="nav">
    <span class="who" id="whoami"></span>
    <a href="/competitors" class="nav-link active">➕ Competitor</a>
    <a href="/volunteer" class="nav-link">🔧 Station</a>
    <a href="/projector" class="nav-link" id="nav-leader">📊 Leaderboard</a>
    <a href="/projector" class="nav-link proj" id="nav-proj" style="display:none">📊 Projector</a>
    <a href="/admin" class="nav-link" id="nav-admin" style="display:none">⚙️ Admin</a>
    <button class="nav-link" style="border:none;cursor:pointer" onclick="logout()">Logout</button>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-ind" onclick="setMode('individual')">👤 Individual</button>
      <button class="tab team" id="tab-team" onclick="setMode('team')">👥 Team (2)</button>
    </div>
    <div class="mode-notice" id="mode-notice">Individual play — compete solo across both PC &amp; Laptop builds.</div>

    <div class="section-label">Primary Student (mandatory)</div>
    <div class="field"><label>Full Name <span class="req">*</span></label>
      <input type="text" id="s1-name" placeholder="Student name"></div>
    <div class="three">
      <div class="field"><label>Department <span class="req">*</span></label><input type="text" id="s1-dept" placeholder="CSE"></div>
      <div class="field"><label>Semester <span class="req">*</span></label><input type="text" id="s1-sem" placeholder="4"></div>
      <div class="field"><label>College <span class="req">*</span></label><input type="text" id="s1-college" placeholder="College name"></div>
    </div>

    <div id="team-section" style="display:none;">
      <div class="section-label">Teammate (required for team play)</div>
      <div class="field"><label>Full Name</label><input type="text" id="s2-name" placeholder="Teammate name"></div>
      <div class="three">
        <div class="field"><label>Department</label><input type="text" id="s2-dept" placeholder="CSE"></div>
        <div class="field"><label>Semester</label><input type="text" id="s2-sem" placeholder="4"></div>
        <div class="field"><label>College</label><input type="text" id="s2-college" placeholder="College name"></div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="submitCompetitor()">Add Competitor</button>
    <div class="msg" id="reg-msg"></div>
  </div>
</div>

<script>
let mode='individual';
function setMode(m){ mode=m;
  document.getElementById('tab-ind').className='tab'+(m==='individual'?' active':'');
  document.getElementById('tab-team').className='tab team'+(m==='team'?' active':'');
  document.getElementById('team-section').style.display=m==='team'?'block':'none';
  document.getElementById('mode-notice').textContent=m==='individual'
    ?'Individual play — compete solo across both PC & Laptop builds.'
    :'Team play (2 students) — both must be registered. Includes the Don\'t Say It mini game.';
}
function byId(id){return document.getElementById(id);}
function val(ids){const a=ids.map(byId);return {name:a[0].value,department:a[1].value,semester:a[2].value,college:a[3].value};}

async function submitCompetitor(){
  const msg=byId('reg-msg'); msg.className='msg err';
  const students=[val(['s1-name','s1-dept','s1-sem','s1-college'])];
  if(mode==='team') students.push(val(['s2-name','s2-dept','s2-sem','s2-college']));
  const res=await fetch('/api/participants',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({play_mode:mode,students})});
  const d=await res.json();
  if(d.ok){ msg.className='msg ok'; msg.textContent=d.msg+'. They can start building right away.';
    ['s1-name','s1-dept','s1-sem','s1-college','s2-name','s2-dept','s2-sem','s2-college'].forEach(id=>{const e=byId(id); if(e)e.value='';});
  } else { msg.className='msg err'; msg.textContent=d.error; }
}
async function logout(){ await fetch('/api/auth/logout',{method:'POST'}); window.location.href='/login'; }
(async function(){ try{ const r=await fetch('/api/auth/me'); const d=await r.json();
  if(d.ok){
    byId('whoami').textContent='👤 '+(d.user.display_name||d.user.username);
    const isStaff=d.user.role!=='volunteer';
    document.getElementById('nav-leader').style.display=isStaff?'none':'';
    document.getElementById('nav-proj').style.display=isStaff?'':'none';
    document.getElementById('nav-admin').style.display=isStaff?'':'none';
  } }catch(e){} })();
</script>
</body>
</html>
