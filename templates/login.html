<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Back — Staff Login</title>
<style>
  :root {--bg:#0f0f13;--surface:#1a1a24;--surface2:#22222f;--border:#2e2e40;
    --accent:#6c63ff;--green:#00e676;--red:#ff5252;--text:#e8e8f0;--muted:#7a7a9a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{width:100%;max-width:440px;}
  header{text-align:center;margin-bottom:24px;}
  header h1{font-size:2.1rem;letter-spacing:4px;text-transform:uppercase;font-weight:800;}
  header h1 span{color:var(--accent);}
  header p{color:var(--muted);margin-top:6px;font-size:0.85rem;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;}

  .tabs{display:flex;gap:6px;margin-bottom:24px;}
  .tab{flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);background:transparent;
       color:var(--muted);font-weight:600;cursor:pointer;font-size:0.85rem;letter-spacing:.5px;transition:all .2s;}
  .tab.active{background:#6c63ff20;color:var(--accent);border-color:var(--accent);}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:0.8rem;color:var(--muted);}
  input{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px 12px;
        border-radius:6px;font-size:0.9rem;width:100%;outline:none;transition:border-color .2s;}
  input:focus{border-color:var(--accent);}

  .btn{width:100%;padding:13px;border:none;border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;transition:opacity .2s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{opacity:.85;}
  .btn-ghost{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
  .btn-ghost:hover{color:var(--text);}

  .divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--muted);font-size:0.8rem;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}

  .msg{display:none;padding:11px 14px;border-radius:8px;font-size:0.85rem;margin-bottom:14px;}
  .msg.err{display:block;background:#ff525210;color:var(--red);border:1px solid #ff525240;}
  .msg.ok{display:block;background:#00e67610;color:var(--green);border:1px solid #00e67640;}
  .note{font-size:0.72rem;color:#5a5a78;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BUILD <span>BACK</span></h1>
    <p>Staff / Volunteer Portal</p>
  </header>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="setTab('login')">Login</button>
      <button class="tab" id="tab-reg" onclick="setTab('reg')">Volunteer Register</button>
    </div>

    <!-- LOGIN -->
    <div id="panel-login">
      <div class="field"><label>Username</label><input type="text" id="login-user" placeholder="username"></div>
      <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="password"></div>
      <button class="btn btn-primary" onclick="staffLogin()">Login</button>
      <div class="msg" id="login-msg"></div>
    </div>

    <!-- VOLUNTEER REGISTER -->
    <div id="panel-reg" style="display:none;">
      <div class="field"><label>Display Name</label><input type="text" id="rg-name" placeholder="Your name"></div>
      <div class="field"><label>Username (3+ chars)</label><input type="text" id="rg-user" placeholder="username"></div>
      <div class="field"><label>Station</label><input type="text" id="rg-station" placeholder="e.g. Station 1"></div>
      <div class="field"><label>Password (4+ chars)</label><input type="password" id="rg-pass" placeholder="password"></div>
      <button class="btn btn-ghost" onclick="registerVolunteer()">Register as Volunteer</button>
      <div class="msg" id="reg-msg"></div>
      <div class="note">Volunteer accounts need admin approval before they can log in. Competitor registration happens after you're logged in (Add Competitor).</div>
    </div>
  </div>
</div>

<script>
function setTab(t){
  document.getElementById('tab-login').className='tab'+(t==='login'?' active':'');
  document.getElementById('tab-reg').className='tab'+(t==='reg'?' active':'');
  document.getElementById('panel-login').style.display=t==='login'?'block':'none';
  document.getElementById('panel-reg').style.display=t==='reg'?'block':'none';
}
function byId(id){return document.getElementById(id);}

async function staffLogin(){
  const msg=byId('login-msg'); msg.className='msg err';
  const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:byId('login-user').value.trim(),password:byId('login-pass').value})});
  const d=await res.json();
  if(d.ok){ window.location.href='/'; } else { msg.textContent=d.error||'Login failed'; }
}

async function registerVolunteer(){
  const msg=byId('reg-msg'); msg.className='msg err';
  const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:byId('rg-user').value.trim(),password:byId('rg-pass').value,
      display_name:byId('rg-name').value.trim(),station:byId('rg-station').value.trim()})});
  const d=await res.json();
  if(d.ok){ msg.className='msg ok'; msg.textContent=d.msg+'. An admin will approve your account.'; }
  else { msg.className='msg err'; msg.textContent=d.error; }
}
</script>
</body>
</html>
