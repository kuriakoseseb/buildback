<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Back — Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root{--bg:#06070b;--ink:#f2f4f7;--muted:#96a0ad;--border:rgba(255,255,255,.12);--accent:#fff;--accent2:#7c8694;
    --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(1200px at 22% 0%,rgba(255,255,255,.07),transparent 55%),var(--bg);
    color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:"";position:fixed;inset:-25%;z-index:-2;
    background:radial-gradient(820px at 18% 18%,rgba(255,255,255,.09),transparent 60%),
      radial-gradient(720px at 86% 14%,rgba(180,190,210,.07),transparent 60%),
      radial-gradient(780px at 78% 86%,rgba(255,255,255,.06),transparent 60%);
    animation:aurora 20s ease-in-out infinite alternate;pointer-events:none;}
  @keyframes aurora{0%{transform:translate(0,0) rotate(0deg);}100%{transform:translate(3%,-2%) rotate(3deg);}}
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

  header{background:rgba(255,255,255,.05);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    border-bottom:2px solid rgba(255,255,255,.2);padding:18px 32px;position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;box-shadow:0 10px 40px rgba(0,0,0,.4);}
  header h1{font-size:2rem;letter-spacing:5px;text-transform:uppercase;font-weight:800;
    background:linear-gradient(90deg,#fff,#8a93a1,#fff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite;}
  @keyframes shine{to{background-position:200% center;}}
  .live-badge{display:flex;align-items:center;gap:8px;font-size:.85rem;color:#fff;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);padding:8px 16px;border-radius:30px;}
  .live-dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:pulse 1.5s infinite;box-shadow:0 0 12px #fff;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}

  .stats{display:flex;gap:0;background:rgba(255,255,255,.04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);padding:14px 32px;}
  .stat{padding:0 40px;border-right:1px solid var(--border);}
  .stat:first-child{padding-left:0;}
  .stat:last-child{border-right:none;}
  .stat .n{font-size:1.9rem;font-weight:800;background:linear-gradient(90deg,#fff,#8a93a1);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat .l{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}

  .tabs{display:flex;gap:0;background:rgba(5,6,10,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);padding:0 32px;position:sticky;top:90px;z-index:40;}
  .tab{padding:16px 30px;font-size:.88rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;
    border:none;background:transparent;color:var(--muted);border-bottom:3px solid transparent;transition:all .25s;font-family:'Inter',sans-serif;}
  .tab:hover{color:#fff;}
  .tab.active-pc{color:#fff;border-bottom-color:var(--accent);text-shadow:0 0 12px rgba(255,255,255,.4);}
  .tab.active-laptop{color:#fff;border-bottom-color:var(--accent);text-shadow:0 0 12px rgba(255,255,255,.4);}
  .tab.active-all{color:#fff;border-bottom-color:var(--accent);text-shadow:0 0 12px rgba(255,255,255,.4);}

  .content{padding:30px 32px;animation:rise .5s both;max-width:1900px;margin:0 auto;}

  .stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:36px;}
  .st-cards-title{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:14px;}
  .st-card{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border);border-radius:16px;padding:18px;min-height:120px;
    transition:all .3s;animation:rise .45s both;box-shadow:0 14px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);}
  .st-card:hover{transform:translateY(-3px);}
  .st-card.offline{opacity:.4;border-style:dashed;}
  .st-card.running{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 30px rgba(255,255,255,.18);animation:pulseBorder 2s infinite;}
  @keyframes pulseBorder{0%,100%{box-shadow:0 0 0 1px var(--accent),0 0 22px rgba(255,255,255,.14);}50%{box-shadow:0 0 0 1px var(--accent),0 0 40px rgba(255,255,255,.3);}}
  .st-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .st-name{font-weight:700;font-size:1rem;}
  .st-flag{font-size:.68rem;padding:2px 7px;border-radius:6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .st-flag.on{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.4);}
  .st-flag.off{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid rgba(255,255,255,.25);}
  .st-flag.run{background:rgba(255,255,255,.18);color:#fff;border:1px solid var(--accent);animation:blink 1s infinite;}
  .st-body .who{font-size:.95rem;font-weight:600;}
  .st-body .cat{font-size:.72rem;color:var(--muted);margin-top:3px;}
  .st-body .st-timer{font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace;color:#fff;margin-top:6px;text-shadow:0 0 14px rgba(255,255,255,.3);}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

  .section{margin-bottom:46px;}
  .section-header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .section-header h2{font-size:1rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);}
  .section-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

  table{width:100%;border-collapse:collapse;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  th{text-align:left;padding:12px 18px;font-size:.72rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);
    border-bottom:1px solid var(--border);}
  td{padding:14px 18px;border-bottom:1px solid var(--border);font-size:1.05rem;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .25s;}
  tbody tr:hover{background:rgba(255,255,255,.05);}
  .rank{font-size:1.5rem;font-weight:800;width:64px;text-align:center;}
  .r1{color:#fff;text-shadow:0 0 16px rgba(255,255,255,.6);} .r2{color:#c9cdd5;} .r3{color:#a9adb6;} .rn{color:var(--muted);font-size:1.2rem;}
  .p-name{font-size:1.2rem;font-weight:600;}
  .p-sub{font-size:.82rem;color:var(--muted);margin-top:3px;}
  .tb{font-family:ui-monospace,monospace;font-size:1rem;color:var(--muted);}
  .tp{font-family:ui-monospace,monospace;font-size:1rem;color:#fff;}
  .tf{font-family:ui-monospace,monospace;font-size:1.35rem;font-weight:700;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.3);}
  .tf.running{animation:blink 1s infinite;text-shadow:0 0 12px rgba(255,255,255,.4);}
  .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.66rem;font-weight:700;text-transform:uppercase;margin-left:6px;letter-spacing:.5px;}
  .tag-run{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.5);}
  .tag-dq{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.5);}
  .tag-wait{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid rgba(255,255,255,.25);}
  .dq-row{opacity:.5;}
  .running-row{background:rgba(255,255,255,.08) !important;}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:.95rem;}

  .combined-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .comb-card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--border);
    border-radius:12px;padding:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .comb-card .pos{font-size:1.9rem;font-weight:800;}
  .comb-card.p1 .pos{color:#fff;text-shadow:0 0 16px rgba(255,255,255,.5);}
  .comb-card.p2 .pos{color:#c9cdd5;} .comb-card.p3 .pos{color:#a9adb6;}
  .comb-card .nm{font-weight:600;margin-top:6px;}
  .comb-card .tm{font-family:ui-monospace,monospace;font-size:1.5rem;font-weight:700;color:#fff;margin-top:6px;}

  @media (max-width:860px){
    header{padding:14px 18px;}
    header h1{font-size:1.4rem;letter-spacing:3px;}
    .stats{padding:12px 18px;overflow-x:auto;}
    .stat{padding:0 22px;}
    .stat .n{font-size:1.4rem;}
    .tabs{padding:0 8px;top:74px;}
    .tab{padding:14px 14px;font-size:.8rem;}
    .content{padding:20px 14px;}
    .stations{grid-template-columns:1fr 1fr;gap:12px;}
    th,td{padding:10px 12px;font-size:.9rem;}
    .rank{font-size:1.2rem;width:44px;}
    .p-name{font-size:1rem;}
    .tf{font-size:1.1rem;}
  }
</style>
</head>
<body>
<header>
  <h1>BUILD BACK</h1>
  <div class="live-badge"><div class="live-dot"></div> LIVE</div>
</header>

<div class="stats" id="stats"></div>

<div class="tabs">
  <button class="tab active-all" id="tab-all" onclick="setView('all')">Overall</button>
  <button class="tab active-pc" id="tab-pc" onclick="setView('PC')">PC</button>
  <button class="tab active-laptop" id="tab-laptop" onclick="setView('Laptop')">Laptop</button>
</div>

<div class="content" id="content"></div>

<script>
const socket=io();
let proj=null, view='all';
socket.on('projector_update',load);
socket.on('leaderboard_update',load);
socket.on('stations_update',load);

async function load(){ const r=await fetch('/api/projector'); proj=await r.json(); render(); }
function setView(v){ view=v; document.querySelectorAll('.tab').forEach(t=>t.className='tab');
  if(v==='all')document.getElementById('tab-all').classList.add('active-all');
  else if(v==='PC')document.getElementById('tab-pc').classList.add('active-pc');
  else document.getElementById('tab-laptop').classList.add('active-laptop');
  render(); }

function render(){
  if(!proj)return;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="n">${proj.finished_count}</div><div class="l">Completed Runs</div></div>
    <div class="stat"><div class="n">${proj.active.length}</div><div class="l">Running Now</div></div>
    <div class="stat"><div class="n">${proj.total_participants}</div><div class="l">Teams/Players</div></div>
    <div class="stat"><div class="n">${proj.combined.length}</div><div class="l">Completed Both</div></div>`;
  const content=document.getElementById('content');
  content.innerHTML=renderStations()+renderMain();
}

function renderStations(){
  loadStationsInto();
  return `<div class="section">
    <div class="st-cards-title">Stations</div>
    <div class="stations" id="stations-grid"><div class="empty">Loading stations…</div></div></div>`;
}
let stationsData=[];
async function loadStationsInto(){
  const r=await fetch('/api/stations'); stationsData=await r.json();
  const g=document.getElementById('stations-grid'); if(!g)return;
  if(!stationsData.length){g.innerHTML='<div class="empty">No stations configured</div>';return;}
  g.innerHTML=stationsData.map(s=>{
    const u=s.user, a=s.active;
    let cls='st-card', flag='off', cat='', who='No active run', timer='—';
    if(a){ cls+=' running'; flag='run'; who=a.name; cat=a.category+' — '+(a.play_mode==='team'?'Team':'Solo');
      timer=fmtLive(a.start_time); }
    else if(u.approved){ flag='on'; who='Ready'; cat='Idle'; }
    return `<div class="${cls}">
      <div class="st-head"><span class="st-name">${esc(u.station||u.username)}</span>
        <span class="st-flag ${flag}">${flag==='run'?'RUN':(flag==='on'?'ON':'OFF')}</span></div>
      <div class="st-body"><div class="who">${esc(who)}</div>
        <div class="cat">${cat}</div>
        ${a?`<div class="st-timer">${timer}</div>`:''}</div>
    </div>`;
  }).join('');
}
function fmtLive(start){ const s=Math.max(0,(Date.now()/1000)-start); const m=Math.floor(s/60); return `${String(m).padStart(2,'0')}:${(s%60).toFixed(1).padStart(4,'0')}`; }

const CATS=['PC','Laptop'];
function renderMain(){
  if(view==='all') return renderCombined()+renderSection('PC',proj.ranked['PC'])+renderSection('Laptop',proj.ranked['Laptop'])+renderArchived();
  return renderSection(view,proj.ranked[view])+renderArchived();
}
function renderCombined(){
  if(!proj.combined.length)return '';
  return `<div class="section">
    <div class="section-header"><h2>Best Combined (PC + Laptop)</h2><div class="section-line"></div></div>
    <div class="combined-grid">${proj.combined.map((c,i)=>{
      const pos=i+1, cls=pos<=3?'p'+pos:'';
      return `<div class="comb-card ${cls}"><div class="pos">${['🥇','🥈','🥉'][i]||pos}</div>
        <div class="nm">${esc(c.name)}${c.play_mode==='team'&&c.mate?`<div style="font-size:.7rem;color:var(--muted)">👥 ${esc(c.mate)}</div>`:''}</div>
        <div class="tm">${fmt(c.total)}</div></div>`;
    }).join('')}</div></div>`;
}
function renderSection(title,data){
  const finished=data.filter(x=>!x.disqualified);
  const total=proj.runs.filter(x=>x.category===title).length;
  const running=(proj.runs||[]).filter(x=>x.category===title&&x.status==='running');
  const dq=proj.runs.filter(x=>x.category===title&&x.disqualified);
  let rows='<div class="empty">No completed runs yet</div>';
  if(finished.length || running.length || dq.length){
    rows=finished.map((p,i)=>{
      const cls=i<3?`r${i+1}`:'rn'; const medal=['🥇','🥈','🥉'][i]||(i+1);
      return `<tr><td><span class="rank ${cls}">${medal}</span></td>
        <td><div class="p-name">${esc(p.name)}</div><div class="p-sub">${p.category}${p.play_mode==='team'&&p.mate?` · Team w/ ${esc(p.mate)}`:''}</div></td>
        <td class="tb">${fmt(p.raw_seconds)}</td><td class="tp">${p.penalty_seconds>0?'+'+p.penalty_seconds+'s':'—'}</td>
        <td class="tp">${p.bonus_seconds>0?'−'+p.bonus_seconds+'s':'—'}</td>
        <td class="tf">${fmt(p.final_seconds)}</td></tr>`;
    }).join('')+
    running.map(p=>`<tr class="running-row"><td><span class="rank rn">—</span></td>
      <td><div class="p-name">${esc(p.name)}</div><div class="p-sub">Running… ${p.play_mode==='team'&&p.mate?`w/ ${esc(p.mate)} `:''}<span class="tag tag-run">LIVE</span></div></td>
      <td colspan="3"></td>
      <td class="tf running" data-live="1" data-start="${p.start_time}">${fmtLive(p.start_time)}</td></tr>`).join('')+
    dq.map(p=>`<tr class="dq-row"><td><span class="rank rn">DQ</span></td>
      <td><div class="p-name">${esc(p.name)}</div></td><td colspan="4" style="color:#fff;font-size:0.9rem">Disqualified</td></tr>`).join('');
  }
  return `<div class="section">
    <div class="section-header"><h2>${title} Build — Ranking</h2><div class="section-line"></div></div>
    <table><thead><tr><th>#</th><th>Participant</th><th>Raw</th><th>Penalties</th><th>Bonuses</th><th>Final</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div style="color:var(--muted);font-size:.8rem;margin-top:10px">${total} registered · ${finished.length} finished · ${running.length} running</div></div>`;
}
function renderArchived(){
  const fin=proj.runs.filter(x=>x.status==='finished'&&!x.disqualified);
  const ordered=[...fin].sort((a,b)=>(b.end_time||0)-(a.end_time||0)).slice(0,12);
  if(!ordered.length)return '';
  return `<div class="section">
    <div class="section-header"><h2>Archive — Recent Finishes</h2><div class="section-line"></div></div>
    <table><thead><tr><th>When</th><th>Participant</th><th>Cat</th><th>Final</th></tr></thead>
    <tbody>${ordered.map(p=>`<tr><td class="tb">${when(p.end_time)}</td>
      <td><div class="p-name">${esc(p.name)}</div></td><td><span class="tag" style="color:#fff;border-color:rgba(255,255,255,.4)">${p.category}</span></td>
      <td class="tf">${fmt(p.final_seconds)}</td></tr>`).join('')}</tbody></table></div>`;
}
function when(t){ const d=new Date(t*1000); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function fmt(s){ if(s===null||s===undefined)return '—'; s=Math.max(0,s); const m=Math.floor(s/60); return `${String(m).padStart(2,'0')}:${(s%60).toFixed(1).padStart(4,'0')}`; }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

load();
setInterval(load,1000);
</script>
</body>
</html>
