<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Back — Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  :root{--bg:#06070b;--ink:#f2f4f7;--muted:#8a93a1;--border:rgba(255,255,255,.12);--accent:#fff;
    --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.09);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(1200px at 22% 0%,rgba(255,255,255,.06),transparent 55%),var(--bg);
    color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
  header{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;}
  header h1{font-size:1.3rem;letter-spacing:4px;text-transform:uppercase;font-weight:800;
    background:linear-gradient(90deg,#fff,#8a93a1,#fff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite;}
  @keyframes shine{to{background-position:200% center;}}
  .live-badge{display:flex;align-items:center;gap:6px;font-size:.7rem;color:#fff;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:30px;}
  .live-dot{width:7px;height:7px;background:#fff;border-radius:50%;animation:pulse 1.5s infinite;box-shadow:0 0 12px #fff;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.8);}}

  .stats{display:flex;gap:0;background:rgba(255,255,255,.04);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);padding:10px 24px;}
  .stat{padding:0 26px;border-right:1px solid var(--border);}
  .stat:first-child{padding-left:0;}
  .stat:last-child{border-right:none;}
  .stat .n{font-size:1.4rem;font-weight:800;background:linear-gradient(90deg,#fff,#8a93a1);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat .l{font-size:.62rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}

  .content{padding:22px 24px;max-width:1900px;margin:0 auto;}

  .section{margin-bottom:30px;}
  .section-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .section-header h2{font-size:.9rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);}
  .section-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

  /* stations */
  .sts-wrap{display:flex;gap:24px;flex-wrap:wrap;}
  .sts-group{flex:1;min-width:340px;}
  .sts-group-title{font-size:.72rem;text-transform:uppercase;letter-spacing:2px;color:#fff;margin-bottom:12px;font-weight:700;}
  .sts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .st-card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border);border-radius:12px;padding:12px;min-height:96px;
    transition:all .3s;box-shadow:0 10px 26px rgba(0,0,0,.3);}
  .st-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .st-code{font-weight:800;font-size:.95rem;letter-spacing:1px;}
  .st-flag{font-size:.6rem;padding:2px 7px;border-radius:6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .st-flag.run{background:rgba(255,255,255,.18);color:#fff;border:1px solid var(--accent);animation:blink 1s infinite;}
  .st-flag.ready{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.4);}
  .st-name{font-size:.95rem;font-weight:600;word-break:break-word;}
  .st-cat{font-size:.62rem;color:var(--muted);margin-top:2px;}
  .st-timer{font-size:1.5rem;font-weight:800;font-family:ui-monospace,monospace;color:#fff;margin-top:4px;
    text-shadow:0 0 12px rgba(255,255,255,.3);}
  .st-timer.final{animation:flashTime 1.2s ease-in-out infinite;}
  @keyframes flashTime{0%,100%{opacity:1;}50%{opacity:.2;}}
  .st-idle{font-size:.75rem;color:var(--muted);margin-top:10px;font-style:italic;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.4;}}

  /* tables */
  table{width:100%;border-collapse:collapse;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border);border-radius:14px;overflow:hidden;font-size:.9rem;}
  th{text-align:left;padding:9px 14px;font-size:.62rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);
    border-bottom:1px solid var(--border);}
  td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.92rem;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .25s;}
  tbody tr:hover{background:rgba(255,255,255,.05);}
  .rank{font-size:1.2rem;font-weight:800;width:52px;text-align:center;}
  .r1{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.6);} .r2{color:#c9cdd5;} .r3{color:#a9adb6;} .rn{color:var(--muted);font-size:1rem;}
  .p-name{font-size:1.05rem;font-weight:600;}
  .p-sub{font-size:.72rem;color:var(--muted);margin-top:2px;}
  .tb{font-family:ui-monospace,monospace;font-size:.9rem;color:var(--muted);}
  .tf{font-family:ui-monospace,monospace;font-size:1.1rem;font-weight:700;color:#fff;text-shadow:0 0 8px rgba(255,255,255,.3);}
  .tf.running{animation:blink 1s infinite;text-shadow:0 0 10px rgba(255,255,255,.4);}
  .tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:.6rem;font-weight:700;text-transform:uppercase;margin-left:6px;letter-spacing:.5px;}
  .tag-run{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.5);}
  .tag-dq{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.5);}
  .dq-row{opacity:.5;}
  .running-row{background:rgba(255,255,255,.08) !important;}
  .empty{text-align:center;color:var(--muted);padding:22px;font-size:.85rem;}

  .combined-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
  .comb-card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--border);
    border-radius:10px;padding:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
  .comb-card .pos{font-size:1.5rem;font-weight:800;}
  .comb-card.p1 .pos{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.5);}
  .comb-card.p2 .pos{color:#c9cdd5;} .comb-card.p3 .pos{color:#a9adb6;}
  .comb-card .nm{font-weight:600;margin-top:4px;font-size:.92rem;}
  .comb-card .tm{font-family:ui-monospace,monospace;font-size:1.25rem;font-weight:700;color:#fff;margin-top:4px;}

  @media (max-width:860px){
    header{padding:10px 14px;}
    header h1{font-size:1.1rem;letter-spacing:3px;}
    .stats{padding:8px 14px;overflow-x:auto;}
    .stat{padding:0 18px;}
    .stat .n{font-size:1.2rem;}
    .content{padding:16px 12px;}
    .sts-wrap{gap:16px;}
    .sts-grid{grid-template-columns:1fr 1fr;}
    th,td{padding:8px 10px;font-size:.85rem;}
    .rank{font-size:1.05rem;width:40px;}
    .p-name{font-size:.95rem;}
    .tf{font-size:1rem;}
  }
</style>
</head>
<body>
<header>
  <h1>BUILD BACK</h1>
  <div class="live-badge"><div class="live-dot"></div> LIVE</div>
</header>

<div class="stats" id="stats"></div>

<div class="content" id="content"></div>

<script>
const socket=io();
let proj=null;
socket.on('projector_update',load);
socket.on('leaderboard_update',load);
socket.on('stations_update',load);

async function load(){ const r=await fetch('/api/projector'); proj=await r.json(); render(); }
const FLASH_SECS=5;

function render(){
  if(!proj)return;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="n">${proj.pc_finished}</div><div class="l">PC Done</div></div>
    <div class="stat"><div class="n">${proj.laptop_finished}</div><div class="l">Laptop Done</div></div>
    <div class="stat"><div class="n">${proj.active.length}</div><div class="l">Live Now</div></div>
    <div class="stat"><div class="n">${proj.total_participants}</div><div class="l">Teams/Players</div></div>
    <div class="stat"><div class="n">${proj.combined.length}</div><div class="l">Done Both</div></div>`;
  document.getElementById('content').innerHTML=
    renderStations()+renderCombined()+renderSection('PC',proj.ranked['PC'],proj.dq_rows['PC'])+
    renderSection('Laptop',proj.ranked['Laptop'],proj.dq_rows['Laptop'])+renderArchived();
}

/* Stations */
function renderStations(){
  const byLevel={};
  (proj.stations||[]).forEach(s=>{ (byLevel[s.level]=byLevel[s.level]||[]).push(s); });
  const groups=Object.keys(byLevel).map(level=>`
    <div class="sts-group">
      <div class="sts-group-title">${level} — ${level==='Level 1'?'PC Build':'Laptop Build'}</div>
      <div class="sts-grid">${byLevel[level].map(stationCard).join('')}</div>
    </div>`).join('');
  return `<div class="section">
    <div class="section-header"><h2>Stations</h2><div class="section-line"></div></div>
    <div class="sts-wrap">${groups||'<div class="empty">No stations</div>'}</div></div>`;
}
function stationCard(s){
  const r=s.run;
  let body='';
  let flag='';
  if(r&&r.status==='running'){
    let elapsed=(Date.now()/1000)-(r.start_time||0)-((r.paused_seconds||0));
    if(r.paused_start) elapsed=Math.max(0,(r.paused_start-r.start_time)-(r.paused_seconds||0));
    body=`<div class="st-name">${esc(r.name)}</div><div class="st-cat">${r.category}${r.play_mode==='team'&&r.mate?` · 👥 ${esc(r.mate)}`:''}</div>
      <div class="st-timer">${fmt(elapsed)}</div>`;
    flag='<span class="st-flag run">'+(r.paused_start?'PAUSED':'RUN')+'</span>';
  } else if(r&&r.status==='waiting'){
    body=`<div class="st-name">${esc(r.name)}</div><div class="st-cat">${r.category}${r.play_mode==='team'&&r.mate?` · 👥 ${esc(r.mate)}`:''}</div>
      <div class="st-timer">READY</div>`;
    flag='<span class="st-flag ready">READY</span>';
  } else if(r&&r.status==='finished'){
    const since=(Date.now()/1000)-(r.end_time||0);
    if(since<FLASH_SECS){
      body=`<div class="st-name">${esc(r.name)}</div><div class="st-cat">${r.category}</div>
        <div class="st-timer final">${r.disqualified?'DQ':fmt(r.final_seconds)}</div>`;
      flag='<span class="st-flag run">DONE</span>';
    } else {
      body=`<div class="st-idle">No team running here</div>`;
    }
  } else {
    body=`<div class="st-idle">No team running here</div>`;
  }
  return `<div class="st-card"><div class="st-head"><span class="st-code">${esc(s.code)}</span>${flag}</div>${body}</div>`;
}

function renderCombined(){
  if(!proj.combined.length)return '';
  return `<div class="section">
    <div class="section-header"><h2>Best Combined (PC + Laptop)</h2><div class="section-line"></div></div>
    <div class="combined-grid">${proj.combined.map((c,i)=>{
      const pos=i+1, cls=pos<=3?'p'+pos:'';
      return `<div class="comb-card ${cls}"><div class="pos">${['🥇','🥈','🥉'][i]||pos}</div>
        <div class="nm">${esc(c.name)}${c.play_mode==='team'&&c.mate?`<div style="font-size:.68rem;color:var(--muted)">👥 ${esc(c.mate)}</div>`:''}</div>
        <div class="tm">${fmt(c.total)}</div></div>`;
    }).join('')}</div></div>`;
}
function renderSection(title,data,dqData){
  const finished=data.filter(x=>!x.disqualified);
  const total=proj.runs.filter(x=>x.category===title).length;
  const running=(proj.runs||[]).filter(x=>x.category===title&&x.status==='running');
  const dq=dqData||[];
  let rows='<div class="empty">No completed runs yet</div>';
  if(finished.length || running.length || dq.length){
    rows=finished.map((p,i)=>{
      const cls=i<3?`r${i+1}`:'rn'; const medal=['🥇','🥈','🥉'][i]||(i+1);
      return `<tr><td><span class="rank ${cls}">${medal}</span></td>
        <td><div class="p-name">${esc(p.name)}</div><div class="p-sub">${p.category}${p.play_mode==='team'&&p.mate?` · Team w/ ${esc(p.mate)}`:''}</div></td>
        <td class="tb">${fmt(p.raw_seconds)}</td><td class="tb">${p.penalty_seconds>0?'+'+p.penalty_seconds+'s':'—'}</td>
        <td class="tb">${p.bonus_seconds>0?'−'+p.bonus_seconds+'s':'—'}</td>
        <td class="tf">${fmt(p.final_seconds)}</td></tr>`;
    }).join('')+
    running.map(p=>`<tr class="running-row"><td><span class="rank rn">—</span></td>
      <td><div class="p-name">${esc(p.name)}</div><div class="p-sub">Running… ${p.play_mode==='team'&&p.mate?`w/ ${esc(p.mate)} `:''}<span class="tag tag-run">LIVE</span></div></td>
      <td colspan="3"></td>
      <td class="tf running" data-live="1" data-start="${p.start_time}" data-paused="${p.paused_seconds||0}">—</td></tr>`).join('')+
    dq.map(p=>`<tr class="dq-row"><td><span class="rank rn">DQ</span></td>
      <td><div class="p-name">${esc(p.name)}</div></td><td colspan="4" style="color:#fff;font-size:.85rem">Disqualified</td></tr>`).join('');
  }
  return `<div class="section">
    <div class="section-header"><h2>${title} Build — Ranking</h2><div class="section-line"></div></div>
    <table><thead><tr><th>#</th><th>Participant</th><th>Raw</th><th>Penalties</th><th>Bonuses</th><th>Final</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div style="color:var(--muted);font-size:.72rem;margin-top:8px">${total} registered runs · ${finished.length} finished · ${running.length} running</div></div>`;
}
function renderArchived(){
  const fin=proj.runs.filter(x=>x.status==='finished'&&!x.disqualified);
  const ordered=[...fin].sort((a,b)=>(b.end_time||0)-(a.end_time||0)).slice(0,10);
  if(!ordered.length)return '';
  return `<div class="section">
    <div class="section-header"><h2>Recent Finishes</h2><div class="section-line"></div></div>
    <table><thead><tr><th>When</th><th>Participant</th><th>Cat</th><th>Final</th></tr></thead>
    <tbody>${ordered.map(p=>`<tr><td class="tb">${when(p.end_time)}</td>
      <td><div class="p-name">${esc(p.name)}</div></td><td><span class="tag" style="color:#fff;border-color:rgba(255,255,255,.4)">${p.category}</span></td>
      <td class="tf">${fmt(p.final_seconds)}</td></tr>`).join('')}</tbody></table></div>`;
}
function when(t){ const d=new Date(t*1000); return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
function fmt(s){ if(s===null||s===undefined)return '—'; s=Math.max(0,s); const m=Math.floor(s/60); return `${String(m).padStart(2,'0')}:${(s%60).toFixed(1).padStart(4,'0')}`; }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

load();
setInterval(()=>{ load(); },1000);
</script>
</body>
</html>
